<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Background -->
  <rect width="240" height="240" fill="#B39DDB" rx="14" ry="14"/>
  <!-- Subtle inner shadow top -->
  <rect width="240" height="30" fill="#ffffff" opacity="0.12" rx="14" ry="14"/>
  <!-- Bottom stripe -->
  <rect x="0" y="195" width="240" height="45" fill="#957fbd" opacity="0.55" rx="0" ry="0"/>
  <rect x="0" y="226" width="240" height="14" fill="#957fbd" rx="0" ry="0"/>

  <!-- Product emoji — large, centred -->
  <text x="120" y="90"
        text-anchor="middle"
        font-size="72"
        font-family="Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif"
        >🦴</text>

  <!-- Italian product name -->
  <text x="120" y="110"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="12" font-weight="bold" fill="#1a1a1a">Shampoo</text>
  

  <!-- English product name -->
  <text x="120" y="148"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="10" fill="#1a1a1a" opacity="0.72">Shampoo</text>
  

  <!-- Footer brand -->
  <text x="120" y="237"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="8" fill="#ffffff" opacity="0.75" letter-spacing="0.5">PaskinoMercato</text>
</svg>